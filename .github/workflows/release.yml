name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Required for npm OIDC trusted publishing (no NPM_TOKEN needed).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing requires npm >= 11.5.1. Node 24 ships npm 11
      # but not always >= 11.5.1, so pin it explicitly.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      # Make sure the published artifact is sound before any release.
      - name: Unit tests
        run: npm run test:unit

      # Opens/updates a "Version Packages" PR when changesets are pending, and
      # publishes to npm when that PR is merged (i.e. no changesets remain).
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm >=11.5.1 + id-token: write enables OIDC trusted publishing.
          NPM_CONFIG_PROVENANCE: 'true'
